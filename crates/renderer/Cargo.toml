[package]
name = "austindelic-blackhole"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Native GPU black-hole renderer with asynchronous terminal cell frames"
readme = "README.md"
repository = "https://github.com/austindelic/blackhole"
homepage = "https://blackhole.austindelic.com"
authors = ["Austin Delic"]
keywords = ["blackhole", "wgpu", "ascii", "terminal"]

[lib]
name = "austindelic_blackhole"

[dependencies]
wgpu = { version = "=29.0.1", default-features = false, features = ["std", "wgsl"] }
pollster = "0.4"
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.30"
anyhow = "1"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=29.0.1", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "=29.0.1", default-features = false, features = ["vulkan"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=29.0.1", default-features = false, features = ["dx12"] }
